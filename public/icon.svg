<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dynamic / Vibrant Brand Gradient -->
    <linearGradient id="imsLogoGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Cutout Mask for the 3 Ascending Speed Slits -->
    <mask id="slitMask">
      <!-- White reveals the hexagon body -->
      <rect width="512" height="512" fill="#ffffff" />
      <!-- Black cuts out the three parallel rounded slots -->
      <!-- Top Slot -->
      <line x1="150" y1="340" x2="280" y2="275" stroke="#000000" stroke-width="26" stroke-linecap="round" />
      <!-- Middle Slot -->
      <line x1="175" y1="380" x2="315" y2="310" stroke="#000000" stroke-width="26" stroke-linecap="round" />
      <!-- Bottom Slot -->
      <line x1="215" y1="416" x2="320" y2="364" stroke="#000000" stroke-width="26" stroke-linecap="round" />
    </mask>

    <!-- Subtle Ambient Glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Hexagon with 3 Cutout Slits -->
  <path
    d="M 256 68 
       C 264 68, 272 73, 276 80 
       L 396 150 
       C 404 155, 408 164, 408 174 
       L 408 338 
       C 408 348, 404 357, 396 362 
       L 276 432 
       C 268 437, 260 442, 256 442 
       C 252 442, 244 437, 236 432 
       L 116 362 
       C 108 357, 104 348, 104 338 
       L 104 174 
       C 104 164, 108 155, 116 150 
       L 236 80 
       C 240 73, 248 68, 256 68 Z"
    fill="url(#imsLogoGrad)"
    mask="url(#slitMask)"
    filter="url(#logoGlow)"
  />
</svg>
